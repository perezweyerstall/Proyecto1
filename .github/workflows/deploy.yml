# Publica la aplicación en GitHub Pages en cada cambio de la rama main.
# Si existen los secretos de Cloudflare y Google, publica también el servidor de voz natural.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    # `bash` explícito activa pipefail: un fallo dentro de una tubería detiene el paso.
    shell: bash

jobs:
  voice-server:
    name: Servidor de voz (Cloudflare)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar los secretos
        id: config
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_GOOGLE_KEY: ${{ secrets.GOOGLE_TTS_KEY != '' }}
          HAS_APP_TOKEN: ${{ secrets.APP_TOKEN != '' }}
        run: |
          missing=""
          [ "$HAS_CF_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$HAS_CF_ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ "$HAS_GOOGLE_KEY" = "true" ] || missing="$missing GOOGLE_TTS_KEY"
          [ "$HAS_APP_TOKEN" = "true" ] || missing="$missing APP_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice title=Voz natural sin configurar::Faltan los secretos:$missing. La app usará la voz del dispositivo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # Las dependencias se instalan sin acceso a los secretos.
      - name: Instalar dependencias
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Publicar el servidor de voz
        id: deploy
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          # Corrige los secretos pegados con espacios o texto de más.
          source scripts/ci-secrets.sh
          if [ "${#APP_TOKEN}" -lt 16 ]; then
            echo "::warning title=APP_TOKEN corto::Usa un código de 16 caracteres o más, generado al azar."
          fi
          if [[ "$APP_TOKEN" == *" "* ]]; then
            echo "::warning title=APP_TOKEN con espacios::¿Es una descripción? Usa un código aleatorio sin espacios."
          fi
          log="$RUNNER_TEMP/deploy.log"
          if ! npx wrangler deploy > "$log" 2>&1; then
            cat "$log"
            if grep -qi 'workers.dev subdomain' "$log"; then
              echo "::error title=Falta el subdominio workers.dev::Abre Workers y Pages en Cloudflare una vez y elige un subdominio."
            elif grep -qiE 'invalid account id|could not route|code: 7003' "$log"; then
              echo "::error title=CLOUDFLARE_ACCOUNT_ID no corresponde a ninguna cuenta::Copia el «Account ID» de Cloudflare en Workers y Pages. No uses el «Zone ID»."
            elif grep -qiE 'authentication (error|failed)|unable to authenticate|invalid (api|access) token|authorization header|code: (1000[01]|9106|9109|6003|6111)' "$log"; then
              echo "::error title=El token de Cloudflare no sirve::Crea un token con la plantilla «Edit Cloudflare Workers» en la misma cuenta. Guárdalo en CLOUDFLARE_API_TOKEN."
            else
              echo "::error title=No se pudo publicar el servidor::Revisa CLOUDFLARE_API_TOKEN (plantilla Edit Cloudflare Workers) y CLOUDFLARE_ACCOUNT_ID."
            fi
            exit 1
          fi
          cat "$log"
          for name in GOOGLE_TTS_KEY APP_TOKEN; do
            if ! printf '%s' "${!name}" | npx wrangler secret put "$name"; then
              echo "::error title=No se pudo guardar $name::Revisa los permisos del token de Cloudflare (plantilla Edit Cloudflare Workers)."
              exit 1
            fi
          done
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$log" | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error title=Sin dirección del servidor::Activa el subdominio workers.dev en Cloudflare: Workers y Pages."
            exit 1
          fi
          # GitHub descarta las salidas que contienen un secreto: el código no puede formar parte de la dirección.
          case "$url" in
            *"$APP_TOKEN"*)
              echo "::error title=Código de acceso demasiado simple::APP_TOKEN aparece dentro de la dirección del servidor. Cámbialo por uno largo y aleatorio (16 caracteres o más)."
              exit 1;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Probar la voz de Google
        if: steps.config.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          source scripts/ci-secrets.sh
          # Genera «Hola.» (5 caracteres del uso gratuito) para comprobar la clave de Google.
          status=000
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o "$RUNNER_TEMP/voz.bin" -w '%{http_code}' -X POST "$URL/tts" \
              -H "X-App-Token: $APP_TOKEN" -H 'Content-Type: application/json' -d '{"text":"Hola."}' || true)
            if [ "$status" = "200" ] && [ "$(wc -c < "$RUNNER_TEMP/voz.bin")" -gt 500 ]; then
              echo "La voz natural funciona."
              exit 0
            fi
            if [ "$status" = "429" ]; then
              echo "::notice title=Límite gratuito alcanzado::El servidor funciona. El uso gratuito del mes está agotado o hay demasiadas peticiones."
              exit 0
            fi
            sleep 5
          done
          echo "Respuesta del servidor ($status):"
          head -c 500 "$RUNNER_TEMP/voz.bin" 2>/dev/null || true
          echo
          if [ "$status" = "000" ]; then
            echo "::error title=Servidor inalcanzable::No se pudo conectar con $URL. Revisa el subdominio workers.dev en Cloudflare."
          else
            echo "::error title=La voz de Google no responde::Revisa la clave GOOGLE_TTS_KEY, la API Cloud Text-to-Speech y la facturación de Google Cloud."
          fi
          exit 1

  build:
    needs: voice-server
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Solo se conecta la voz natural si el servidor pasó la prueba con Google.
          VITE_TTS_URL: ${{ needs.voice-server.result == 'success' && needs.voice-server.outputs.url || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
